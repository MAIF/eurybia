[build-system]
requires = ["setuptools>=77", "setuptools-scm>=8", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "eurybia"
dynamic = ["version"]
authors = [
    {name = "Nicolas Roux"},
    {name = "Thomas Bouché", email = "thomas.bouche@maif.fr"},
    {name = "Johann Martin"},
]
description = "Eurybia monitor model drift over time and securize model deployment with data validation"
readme = "README.md"
requires-python = ">=3.11,<3.15"
license = "Apache-2.0"
license-files = ["LICENSE"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Operating System :: OS Independent",
]
dependencies = [
    "pandas>=2.2.2,!=3.0.4,<4",
    "catboost>=1.2.8",
    "panel>=1.4.1",
    "jinja2>=3.1",
    "scipy>=1.4.0",
    "shapash>=2.10",
    "plotly>=5.24.1,<8",
]

[project.optional-dependencies] # Optional
all = ["eurybia[dev, test]"]
dev = ["pre-commit", "mypy==2.4.1", "ruff==0.17.5"]
test = ["pytest>=8", "pytest-cov>=6"]

[tool.setuptools]
package-dir = {"" = "."}

[tool.setuptools_scm]

[tool.setuptools.packages.find]
where = ["."]

[tool.setuptools.package-data]
"*" = ["*.csv", "*json", "*.yml", "*.css", "*.js", "*.ico", "*.png"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.coverage.report]
show_missing = true
fail_under = 85

[tool.mypy]
exclude = ["tests", "tutorial"]
ignore_missing_imports = true
check_untyped_defs = true
disallow_incomplete_defs = true
disallow_untyped_defs = true

[tool.ruff]
line-length = 120
exclude = [
    "tests",
    "docs",
]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "F",    # pyflakes
    "W",    # pycodestyle warnings
    "A",    # flake8-builtins
    "PLC",  # pylint conventions
    "PLE",  # pylint errors
    "PLW",  # pylint warnings
    "UP",   # pyupgrade
    "S",    # flake8-bandit,
    "B",    # flake8-bugbear
    "I",    # isort
    "D",    # pydocstyle
    "NPY",  # NumPy-specific rules
    "ANN",  # flake8-annotations
]
ignore = ["E501", "D100", "D104", "D105", "D107", "D401", "S311", "ANN401"]
exclude = ["tests/*"]

[tool.ruff.lint.pydocstyle]
convention = "numpy"

[tool.ruff.lint.per-file-ignores]
"eurybia/__init__.py" = ["F401"]
"!eurybia/**" = ["ANN"]
"tutorial/**/*.ipynb" = ["D1", "E402", "S101"]
