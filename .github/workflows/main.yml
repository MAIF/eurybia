name: Build & Test
on:
  push:
  pull_request:
  workflow_call:
    secrets:
      CODECOV_TOKEN:
        required: false

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  code_quality:
    name: Code Quality
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
    - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      with:
        fetch-depth: 0
        persist-credentials: false
    - name: Set up uv and Python 3.11
      uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
      with:
        python-version: "3.11"
        activate-environment: true
    - name: Install dev and test dependencies
      run: uv pip install '.[dev,test]'
    - name: Check linting
      run: make lint
    - name: Check formatting
      run: make format
    - name: Check type annotations
      run: make typecheck

  workflow_audit:
    name: Workflow Audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
    - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      with:
        persist-credentials: false
    - name: Set up uv
      uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
      with:
        python-version: "3.11"
    - name: Audit workflows
      env:
        GH_TOKEN: ${{ github.token }}
      run: uvx --from zizmor==1.32.0 zizmor .github

  build_test:
    name: Build & Test (${{ matrix.python-version }})
    needs: code_quality
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    steps:
    - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      with:
        fetch-depth: 0
        persist-credentials: false
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
      with:
        python-version: ${{ matrix.python-version }}
        cache: pip
        cache-dependency-path: pyproject.toml
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        python -m pip install build '.[test]'
    - name: Test with pytest
      if: matrix.python-version != '3.12'
      run: |
        python -m pytest
    - name: Test with coverage
      if: matrix.python-version == '3.12'
      run: python -m pytest --cov=eurybia --cov-branch --cov-report=term-missing --cov-report=xml
    - name: Upload coverage to Codecov
      if: matrix.python-version == '3.12'
      uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v6.0.2
      with:
        token: ${{ secrets.CODECOV_TOKEN }}
        files: ./coverage.xml
        fail_ci_if_error: false
        disable_search: true
    - name: Build python package
      run: |
        python -m build
  lowest_deps:
    name: Lowest Dependencies
    needs: code_quality
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
    - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      with:
        fetch-depth: 0
        persist-credentials: false
    - name: Set up uv and Python 3.11
      uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
      with:
        python-version: "3.11"
        activate-environment: true
    - name: Install dependencies
      run: uv pip install --resolution lowest-direct '.[test]'
    - name: Test with pytest
      run: python -m pytest
