---
default_language_version:
  python: python3
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-ast
        exclude: \.ipynb$
      - id: check-case-conflict
        exclude: \.ipynb$
      - id: check-merge-conflict
        exclude: \.ipynb$
      - id: check-docstring-first
        exclude: \.ipynb$
      - id: check-shebang-scripts-are-executable
        exclude: \.ipynb$
      - id: check-json
        exclude: \.ipynb$
      - id: check-toml
        exclude: \.ipynb$
      - id: check-yaml
        exclude: ^(chart/|docs/|.*\.ipynb$)
      - id: debug-statements
        exclude: \.ipynb$
      - id: end-of-file-fixer
        exclude: ^(docs/|gdocs/|.*\.ipynb$)
      - id: fix-byte-order-marker
        exclude: \.ipynb$
      - id: pretty-format-json
        args: ['--autofix']
        exclude: \.ipynb$
      - id: trailing-whitespace
        args: ['--markdown-linebreak-ext=md']
        exclude: ^(docs/|gdocs/|.*\.ipynb$)
      - id: mixed-line-ending
        args: ['--fix=lf']
        exclude: ^(docs/|gdocs/|.*\.ipynb$)
      - id: check-added-large-files
        args: ['--maxkb=500']
        exclude: \.ipynb$
      - id: no-commit-to-branch
        args: ['--branch', 'master', '--branch', 'develop']
        exclude: \.ipynb$
  - repo: local
    hooks:
      - id: ruff-check
        name: ruff check
        entry: bash -c 'PATH=".venv/bin:.venv/Scripts:$PATH" exec "$@"' -- ruff check --fix --force-exclude
        language: system
        types_or: [python, pyi, jupyter]
        require_serial: true
      - id: ruff-format
        name: ruff format
        entry: bash -c 'PATH=".venv/bin:.venv/Scripts:$PATH" exec "$@"' -- ruff format --force-exclude
        language: system
        types_or: [python, pyi, jupyter]
        require_serial: true
      - id: mypy
        name: mypy
        entry: bash -c 'PATH=".venv/bin:.venv/Scripts:$PATH" exec "$@"' -- mypy eurybia
        language: system
        pass_filenames: false
        files: ^eurybia/.*\.py$
  - repo: https://github.com/adamchainz/blacken-docs
    rev: 1.20.0
    hooks:
      - id: blacken-docs
        additional_dependencies: [black==26.5.1]
  - repo: https://github.com/compilerla/conventional-pre-commit
    rev: v4.3.0
    hooks:
      - id: conventional-pre-commit
        stages: [commit-msg]
        args: [] # optional: list of Conventional Commits types to allow e.g. [feat, fix, ci, chore, test]
        exclude: \.ipynb$
